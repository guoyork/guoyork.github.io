<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - Yongkang Guo</title>
    <style>
        :root {
            /* Dark Mode (Default) */
            --bg-color: #050505;
            --card-bg: #111111;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-color: #00f3ff; /* Cyan tech glow */
            --border-color: #333;
            --font-tech: 'Courier New', Courier, monospace;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --shadow-color: rgba(0, 243, 255, 0.15);
            --title-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        [data-theme="light"] {
            /* Light Mode Overrides */
            --bg-color: #ffffff;
            --card-bg: #f8f9fa;
            --text-main: #333333;
            --text-muted: #555555;
            --accent-color: #0056b3;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 86, 179, 0.15);
            --title-shadow: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            gap: 1rem;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        .nav-links a {
            font-family: var(--font-tech);
            color: var(--text-muted);
            text-decoration: none;
            margin-right: 1rem;
            font-size: 1.1rem;
            transition: color 0.2s;
            border: none;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        .theme-switch {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: var(--font-tech);
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .theme-switch:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        h1 {
            font-family: var(--font-tech);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
            text-shadow: var(--title-shadow);
            margin-top: 2rem;
        }

        section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .paper-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2.5rem; /* Increased padding */
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .paper-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--shadow-color);
        }

        .paper-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .paper-card:hover::before {
            opacity: 1;
        }

        .paper-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem; /* Increased spacing */
            color: var(--accent-color);
            font-family: var(--font-tech);
        }
        
        .paper-authors {
            margin-bottom: 1rem; /* Increased spacing */
            font-style: italic;
        }

        .paper-venue {
            font-weight: bold;
            margin-bottom: 1.5rem; /* Increased spacing */
            color: var(--text-main);
        }

        .paper-abstract {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem; /* Increased spacing */
        }

        .paper-links a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-color);
            margin-right: 1rem;
            font-family: var(--font-tech);
        }

        .paper-links a:hover {
            border-bottom-style: solid;
        }

        @media (max-width: 600px) {
            .top-nav {
                position: relative;
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 1rem;
            }
            header {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="top-nav">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="publications.html" class="active">Publications</a>
            </div>
            <button class="theme-switch" id="theme-toggle">
                [ Light Mode ]
            </button>
        </div>
        <h1>Full Publications</h1>
    </header>

    <main>
        <section id="publications-container">
            <!-- Publications will be injected here via JavaScript -->
        </section>
    </main>

    <!-- Data source from local folder simulation -->
    <script src="publications-data.js"></script>

    <script>
        // Render Publications dynamically
        const container = document.getElementById('publications-container');
        
        if (typeof publications !== 'undefined') {
            publications.forEach(paper => {
                const card = document.createElement('div');
                card.className = 'paper-card';
                
                card.innerHTML = `
                    <div class="paper-title">${paper.title}</div>
                    <div class="paper-authors">${paper.authors}</div>
                    <div class="paper-venue">${paper.venue}</div>
                    <div class="paper-abstract">${paper.abstract}</div>
                    <div class="paper-links">
                        <a href="${paper.link}">[Arxiv]</a>
                    </div>
                `;
                
                container.appendChild(card);
            });
        } else {
            container.innerHTML = '<p>Error loading publications data.</p>';
        }

        // Theme Switcher Logic
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        
        // Check for saved preference
        if (localStorage.getItem('theme') === 'light') {
            body.setAttribute('data-theme', 'light');
            toggleBtn.textContent = '[ Dark Mode ]';
        }

        toggleBtn.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                toggleBtn.textContent = '[ Light Mode ]';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                toggleBtn.textContent = '[ Dark Mode ]';
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
